name: Deploy docs

# main 에 문서·사이트 코드가 push 되면 S3 + CloudFront 로 배포하고 챗봇 Lambda 의 문서 컨텍스트를 갱신한다.
# 인프라 변경(terraform apply)은 하지 않는다 → 로컬에서 `npm run infra:apply`.
#
# 필요한 GitHub Variables (Settings → Secrets and variables → Actions → Variables)
#   DOCS_DEPLOY_ROLE_ARN : terraform output github_deploy_role_arn
#   S3_BUCKET            : terraform output bucket_name
#   CF_DISTRIBUTION_ID   : terraform output distribution_id
#   CHAT_LAMBDA_NAME     : terraform output chat_lambda_name (챗봇을 끄면 비워둠)
# DOCS_DEPLOY_ROLE_ARN 이 없으면 배포 잡은 건너뛴다.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".vitepress/**"
      - "scripts/**"
      - "infra/lambda/src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ vars.DOCS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ap-northeast-2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # VitePress "최종 수정" 날짜가 git 이력을 사용

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DOCS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        run: bash scripts/deploy.sh
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
          CHAT_LAMBDA_NAME: ${{ vars.CHAT_LAMBDA_NAME }}
